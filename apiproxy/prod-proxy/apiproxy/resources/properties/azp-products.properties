# Maps the VERIFIED JWT azp (Keycloak client id) to the API Product whose
# custom attributes govern the request, per Apigee environment.
#
# Key:   <environment>__<azp>, with every character other than [A-Za-z0-9]
#        replaced by "_" (see resolveProduct.js), e.g. prod-env + biscuit-coffee-agent
#        -> prod_env__biscuit_coffee_agent
# Value: API Product name (read with AccessEntity, cached 60 s).
#
# A token whose azp has no entry for the current environment is refused with
# 403 (RF-Client-Not-Allowed). That also keeps dev-only clients out of prod.

# prod-env
prod_env__biscuit_coffee_agent=biscuit-coffee-agent
prod_env__biscuit_coffee_staff=biscuit-coffee-staff

# default-dev: the dev client and the prod customer client both use the dev
# product, so product changes can be tested in dev without touching prod.
default_dev__biscuit_coffee_agent_dev=biscuit-coffee-agent-dev
default_dev__biscuit_coffee_agent=biscuit-coffee-agent-dev
default_dev__biscuit_coffee_staff=biscuit-coffee-staff
